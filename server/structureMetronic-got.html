<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📁 User Management Module Generator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 1600px;
      margin: 0 auto;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
      color: white;
    }
    .header h1 { font-size: 2.2em; margin-bottom: 5px; }
    .header p { opacity: 0.9; }
    
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    
    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      max-height: 80vh;
      overflow-y: auto;
    }
    
    .card h2 {
      color: #333;
      margin-bottom: 15px;
      padding-bottom: 8px;
      border-bottom: 3px solid #667eea;
      position: sticky;
      top: 0;
      background: white;
      z-index: 10;
    }
    
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: 600; color: #555; }
    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 0.95em;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
    }
    
    .backend-config {
      background: #f8f9fa;
      border-radius: 10px;
      padding: 15px;
      margin: 15px 0;
    }
    
    .radio-group {
      display: flex;
      gap: 15px;
      margin: 10px 0;
    }
    .radio-option { flex: 1; }
    .radio-option input { width: auto; margin-right: 5px; }
    
    .path-input {
      background: white;
      padding: 12px;
      border-radius: 8px;
      border: 2px solid #e0e0e0;
      margin-top: 10px;
    }
    
    .fields-section {
      background: #f8f9fa;
      border-radius: 10px;
      padding: 15px;
      margin: 15px 0;
    }
    
    .field-list {
      max-height: 200px;
      overflow-y: auto;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 10px;
      background: white;
    }
    
    .field-item {
      display: flex;
      align-items: center;
      padding: 8px;
      border-bottom: 1px solid #f0f0f0;
    }
    .field-item:last-child { border-bottom: none; }
    .field-item input[type="checkbox"] { width: auto; margin-right: 10px; }
    .field-name { flex: 1; font-family: monospace; }
    .field-type {
      background: #e3f2fd;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.8em;
      color: #1976d2;
    }
    
    .btn {
      padding: 12px 25px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      width: 100%;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(102,126,234,0.4);
    }
    
    .tabs {
      display: flex;
      gap: 5px;
      margin-bottom: 15px;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      background: white;
      padding: 10px 0;
      z-index: 10;
    }
    .tab {
      padding: 8px 15px;
      background: #f0f0f0;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.9em;
      font-weight: 600;
      transition: all 0.3s;
    }
    .tab.active {
      background: #667eea;
      color: white;
    }
    
    .code-block {
      background: #1e1e2d;
      color: #fff;
      padding: 15px;
      border-radius: 10px;
      font-family: 'Courier New', monospace;
      font-size: 0.85em;
      max-height: 500px;
      overflow-y: auto;
      white-space: pre-wrap;
      margin-bottom: 10px;
    }
    
    .file-tree {
      background: #1e1e2d;
      color: #fff;
      padding: 15px;
      border-radius: 10px;
      font-family: 'Courier New', monospace;
      font-size: 0.85em;
      max-height: 400px;
      overflow-y: auto;
      margin-bottom: 15px;
    }
    
    .folder { color: #ffd700; }
    .file { color: #98fb98; }
    .indent { margin-left: 20px; }
    
    .copy-btn {
      background: #50cd89;
      color: white;
      border: none;
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9em;
      float: right;
    }
    .copy-btn:hover { background: #3ba36b; }
    
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 15px;
    }
    .stat-item {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
    }
    .stat-value { font-size: 1.5em; font-weight: bold; }
    .stat-label { font-size: 0.8em; opacity: 0.9; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>📁 User Management Module Generator</h1>
    <p>สร้างครบทุกไฟล์ตามโครงสร้าง user-management (37 ไฟล์)</p>
  </div>

  <div class="grid-2">
    <!-- Left: Input Form -->
    <div class="card">
      <h2>📝 กำหนดค่า Module</h2>
      
      <div class="form-group">
        <label>🔤 ชื่อ Module (ตัวเล็ก) เช่น user</label>
        <input type="text" id="moduleName" value="user" placeholder="user">
      </div>
      
      <div class="form-group">
        <label>🏷️ ชื่อ Module (ตัวใหญ่) เช่น User</label>
        <input type="text" id="moduleCapital" value="User" placeholder="User">
      </div>
      
      <div class="form-group">
        <label>📂 Base Path</label>
        <input type="text" id="basePath" value="src/app/modules/apps" placeholder="src/app/modules/apps">
      </div>

      <div class="backend-config">
        <h3>🔧 Backend</h3>
        <div class="radio-group">
          <label class="radio-option"><input type="radio" name="backendType" value="firebase" checked> 🔥 Firebase</label>
          <label class="radio-option"><input type="radio" name="backendType" value="mongodb"> 🍃 MongoDB</label>
          <label class="radio-option"><input type="radio" name="backendType" value="api"> 🌐 REST API</label>
        </div>

        <div id="firebaseConfig" class="path-input">
          <label>📂 Firebase Path</label>
          <input type="text" id="firebasePath" value="../../../../../firebase/useFirebase">
        </div>
        <div id="mongodbConfig" class="path-input" style="display:none">
          <label>🌐 API URL</label>
          <input type="text" id="mongodbUrl" value="http://localhost:8000/api">
        </div>
        <div id="apiConfig" class="path-input" style="display:none">
          <label>🌐 API URL</label>
          <input type="text" id="apiUrl" value="http://localhost:8000/api">
        </div>
      </div>

      <div class="fields-section">
        <h3>📋 Interface Fields</h3>
        <textarea id="interfaceFields" rows="8" style="font-family: monospace;">id?: string
username: string
email: string
first_name: string
last_name: string
department_id: string
position_id: string
leave_days: number
status: 'Active' | 'Inactive' | 'On Leave'
image_url: string
createdAt?: string
updatedAt?: string</textarea>
      </div>

      <button class="btn btn-primary" onclick="generateModule()">🚀 Generate Module Structure</button>
    </div>

    <!-- Right: Output Preview -->
    <div class="card">
      <h2>📂 โครงสร้างไฟล์ทั้งหมด (37 ไฟล์)</h2>
      
      <div class="stats">
        <div class="stat-item"><span class="stat-value" id="folderCount">10</span><span class="stat-label">Folders</span></div>
        <div class="stat-item"><span class="stat-value" id="fileCount">37</span><span class="stat-label">Files</span></div>
        <div class="stat-item"><span class="stat-value" id="apiCount">7</span><span class="stat-label">APIs</span></div>
        <div class="stat-item"><span class="stat-value" id="componentCount">25</span><span class="stat-label">Components</span></div>
      </div>

      <div class="file-tree" id="fileTree"></div>

      <div class="tabs" id="fileTabs">
        <!-- Tabs จะถูกสร้างด้วย JavaScript -->
      </div>

      <div class="code-block" id="codePreview">กำลังโหลด...</div>
      <button class="copy-btn" onclick="copyCurrentCode()">📋 คัดลอกโค้ดนี้</button>
    </div>
  </div>
</div>

<script>
  let currentModule = {
    name: 'user',
    capital: 'User',
    basePath: 'src/app/modules/apps',
    backendType: 'firebase',
    firebasePath: '../../../../../firebase/useFirebase'
  };

  let currentFile = 'page';

  // รายการไฟล์ทั้งหมดตามโครงสร้าง user-management
  const allFiles = [
    { id: 'page', name: '[Module]Page.tsx', path: '[Module]Page.tsx', folder: 'root' },
    
    // users-list folder
    { id: 'list', name: '[Module]List.tsx', path: '[module]-list/[Module]List.tsx', folder: 'list' },
    
    // header components
    { id: 'toolbar', name: '[Module]ListToolbar.tsx', path: '[module]-list/components/header/[Module]ListToolbar.tsx', folder: 'header' },
    { id: 'filter', name: '[Module]ListFilter.tsx', path: '[module]-list/components/header/[Module]ListFilter.tsx', folder: 'header' },
    { id: 'grouping', name: '[Module]ListGrouping.tsx', path: '[module]-list/components/header/[Module]ListGrouping.tsx', folder: 'header' },
    { id: 'listheader', name: '[Module]ListHeader.tsx', path: '[module]-list/components/header/[Module]ListHeader.tsx', folder: 'header' },
    { id: 'search', name: '[Module]ListSearchComponent.tsx', path: '[module]-list/components/header/[Module]ListSearchComponent.tsx', folder: 'header' },
    
    // loading components
    { id: 'loading', name: '[Module]ListLoading.tsx', path: '[module]-list/components/loading/[Module]ListLoading.tsx', folder: 'loading' },
    
    // pagination components
    { id: 'pagination', name: '[Module]ListPagination.tsx', path: '[module]-list/components/pagination/[Module]ListPagination.tsx', folder: 'pagination' },
    
    // core files
    { id: 'models', name: '_models.ts', path: '[module]-list/core/_models.ts', folder: 'core' },
    { id: 'requests', name: '_requests.ts', path: '[module]-list/core/_requests.ts', folder: 'core' },
    { id: 'ListViewProvider', name: 'ListViewProvider.tsx', path: '[module]-list/core/ListViewProvider.tsx', folder: 'core' },
    { id: 'QueryRequestProvider', name: 'QueryRequestProvider.tsx', path: '[module]-list/core/QueryRequestProvider.tsx', folder: 'core' },
    { id: 'QueryResponseProvider', name: 'QueryResponseProvider.tsx', path: '[module]-list/core/QueryResponseProvider.tsx', folder: 'core' },
    
    // table
    { id: 'table', name: '[Module]Table.tsx', path: '[module]-list/table/[Module]Table.tsx', folder: 'table' },
    
    // columns
    { id: 'columns', name: '_columns.tsx', path: '[module]-list/table/columns/_columns.tsx', folder: 'columns' },
    { id: 'CustomHeaderColumn', name: 'CustomHeaderColumn.tsx', path: '[module]-list/table/columns/CustomHeaderColumn.tsx', folder: 'columns' },
    { id: 'CustomRow', name: 'CustomRow.tsx', path: '[module]-list/table/columns/CustomRow.tsx', folder: 'columns' },
    { id: 'ActionsCell', name: '[Module]ActionsCell.tsx', path: '[module]-list/table/columns/[Module]ActionsCell.tsx', folder: 'columns' },
    { id: 'CustomHeader', name: '[Module]CustomHeader.tsx', path: '[module]-list/table/columns/[Module]CustomHeader.tsx', folder: 'columns' },
    { id: 'DepartmentCell', name: '[Module]DepartmentCell.tsx', path: '[module]-list/table/columns/[Module]DepartmentCell.tsx', folder: 'columns' },
    { id: 'EmailCell', name: '[Module]EmailCell.tsx', path: '[module]-list/table/columns/[Module]EmailCell.tsx', folder: 'columns' },
    { id: 'InfoCell', name: '[Module]InfoCell.tsx', path: '[module]-list/table/columns/[Module]InfoCell.tsx', folder: 'columns' },
    { id: 'LeaveDaysCell', name: '[Module]LeaveDaysCell.tsx', path: '[module]-list/table/columns/[Module]LeaveDaysCell.tsx', folder: 'columns' },
    { id: 'PositionCell', name: '[Module]PositionCell.tsx', path: '[module]-list/table/columns/[Module]PositionCell.tsx', folder: 'columns' },
    { id: 'SelectionCell', name: '[Module]SelectionCell.tsx', path: '[module]-list/table/columns/[Module]SelectionCell.tsx', folder: 'columns' },
    { id: 'SelectionHeader', name: '[Module]SelectionHeader.tsx', path: '[module]-list/table/columns/[Module]SelectionHeader.tsx', folder: 'columns' },
    { id: 'StatusCell', name: '[Module]StatusCell.tsx', path: '[module]-list/table/columns/[Module]StatusCell.tsx', folder: 'columns' },
    
    // edit modal files
    { id: 'ChangePasswordModal', name: 'ChangePasswordModal.tsx', path: '[module]-edit-modal/ChangePasswordModal.tsx', folder: 'edit-modal' },
    { id: 'CreateDepartmentModal', name: 'CreateDepartmentModal.tsx', path: '[module]-edit-modal/CreateDepartmentModal.tsx', folder: 'edit-modal' },
    { id: 'EditModal', name: '[Module]EditModal.tsx', path: '[module]-edit-modal/[Module]EditModal.tsx', folder: 'edit-modal' },
    { id: 'EditModalForm', name: '[Module]EditModalForm.tsx', path: '[module]-edit-modal/[Module]EditModalForm.tsx', folder: 'edit-modal' },
    { id: 'EditModalFormWrapper', name: '[Module]EditModalFormWrapper.tsx', path: '[module]-edit-modal/[Module]EditModalFormWrapper.tsx', folder: 'edit-modal' },
    { id: 'EditModalHeader', name: '[Module]EditModalHeader.tsx', path: '[module]-edit-modal/[Module]EditModalHeader.tsx', folder: 'edit-modal' }
  ];

  function generateModule() {
    // อ่านค่าจาก input
    currentModule.name = document.getElementById('moduleName').value.toLowerCase();
    currentModule.capital = document.getElementById('moduleCapital').value;
    currentModule.basePath = document.getElementById('basePath').value;
    currentModule.backendType = document.querySelector('input[name="backendType"]:checked').value;
    currentModule.firebasePath = document.getElementById('firebasePath')?.value || '';
    currentModule.apiUrl = document.getElementById('apiUrl')?.value || '';
    currentModule.mongodbUrl = document.getElementById('mongodbUrl')?.value || '';

    // สร้าง tabs
    createTabs();
    
    // อัพเดท file tree
    updateFileTree();
    
    // แสดงโค้ดแรก
    showFile('page');
  }

  function createTabs() {
    const tabsHtml = allFiles.map(file => {
      const fileName = file.name.replace('[Module]', currentModule.capital);
      return `<div class="tab ${file.id === currentFile ? 'active' : ''}" onclick="showFile('${file.id}')">📄 ${fileName}</div>`;
    }).join('');
    
    document.getElementById('fileTabs').innerHTML = tabsHtml;
  }

  function showFile(fileId) {
    currentFile = fileId;
    createTabs();
    
    let code = '';
    const file = allFiles.find(f => f.id === fileId);
    
    if (fileId === 'page') code = generatePageCode();
    else if (fileId === 'list') code = generateListCode();
    else if (fileId === 'models') code = generateModelsCode();
    else if (fileId === 'requests') code = generateRequestsCode();
    else if (fileId === 'ListViewProvider') code = generateListViewProvider();
    else if (fileId === 'QueryRequestProvider') code = generateQueryRequestProvider();
    else if (fileId === 'QueryResponseProvider') code = generateQueryResponseProvider();
    else if (fileId === 'table') code = generateTableCode();
    else if (fileId === 'columns') code = generateColumnsCode();
    else if (fileId === 'EditModal') code = generateEditModalCode();
    else if (fileId === 'EditModalForm') code = generateEditModalFormCode();
    else if (fileId === 'ActionsCell') code = generateActionsCellCode();
    else if (fileId === 'StatusCell') code = generateStatusCellCode();
    else if (fileId === 'InfoCell') code = generateInfoCellCode();
    else if (fileId === 'EmailCell') code = generateEmailCellCode();
    else if (fileId === 'DepartmentCell') code = generateDepartmentCellCode();
    else if (fileId === 'PositionCell') code = generatePositionCellCode();
    else if (fileId === 'LeaveDaysCell') code = generateLeaveDaysCellCode();
    else code = '// ' + file.name + '\n\n// กรุณาเพิ่มโค้ดตามต้องการ';
    
    document.getElementById('codePreview').textContent = code;
  }

  function updateFileTree() {
    const m = currentModule;
    
    const tree = `
📁 ${m.basePath}/${m.name}-management/
  📄 ${m.capital}Page.tsx
  📁 ${m.name}-list/
    📄 ${m.capital}List.tsx
    📁 components/
      📁 header/
        📄 ${m.capital}ListToolbar.tsx
        📄 ${m.capital}ListFilter.tsx
        📄 ${m.capital}ListGrouping.tsx
        📄 ${m.capital}ListHeader.tsx
        📄 ${m.capital}ListSearchComponent.tsx
      📁 loading/
        📄 ${m.capital}ListLoading.tsx
      📁 pagination/
        📄 ${m.capital}ListPagination.tsx
    📁 core/
      📄 _models.ts
      📄 _requests.ts
      📄 ListViewProvider.tsx
      📄 QueryRequestProvider.tsx
      📄 QueryResponseProvider.tsx
    📁 table/
      📄 ${m.capital}Table.tsx
      📁 columns/
        📄 _columns.tsx
        📄 CustomHeaderColumn.tsx
        📄 CustomRow.tsx
        📄 ${m.capital}ActionsCell.tsx
        📄 ${m.capital}CustomHeader.tsx
        📄 ${m.capital}DepartmentCell.tsx
        📄 ${m.capital}EmailCell.tsx
        📄 ${m.capital}InfoCell.tsx
        📄 ${m.capital}LeaveDaysCell.tsx
        📄 ${m.capital}PositionCell.tsx
        📄 ${m.capital}SelectionCell.tsx
        📄 ${m.capital}SelectionHeader.tsx
        📄 ${m.capital}StatusCell.tsx
  📁 ${m.name}-edit-modal/
    📄 ChangePasswordModal.tsx
    📄 CreateDepartmentModal.tsx
    📄 ${m.capital}EditModal.tsx
    📄 ${m.capital}EditModalForm.tsx
    📄 ${m.capital}EditModalFormWrapper.tsx
    📄 ${m.capital}EditModalHeader.tsx
    `.trim();
    
    document.getElementById('fileTree').innerHTML = tree.replace(/ /g, '&nbsp;').replace(/\n/g, '<br>');
  }

  // ========== Code Generators ==========
  
  function generatePageCode() {
    const m = currentModule;
    return `import { FC } from 'react'
import { ListViewProvider } from './${m.name}-list/core/ListViewProvider'
import { QueryRequestProvider } from './${m.name}-list/core/QueryRequestProvider'
import { QueryResponseProvider } from './${m.name}-list/core/QueryResponseProvider'
import { ${m.capital}List } from './${m.name}-list/${m.capital}List'

const ${m.capital}Page: FC = () => {
  return (
    <QueryRequestProvider>
      <QueryResponseProvider>
        <ListViewProvider>
          <${m.capital}List />
        </ListViewProvider>
      </QueryResponseProvider>
    </QueryRequestProvider>
  )
}

export { ${m.capital}Page }`;
  }

  function generateListCode() {
    const m = currentModule;
    return `import { FC } from 'react'
import { ${m.capital}ListHeader } from './components/header/${m.capital}ListHeader'
import { ${m.capital}Table } from './table/${m.capital}Table'
import { ${m.capital}ListLoading } from './components/loading/${m.capital}ListLoading'
import { ${m.capital}ListPagination } from './components/pagination/${m.capital}ListPagination'
import { useQueryResponseLoading } from './core/QueryResponseProvider'

const ${m.capital}List: FC = () => {
  const isLoading = useQueryResponseLoading()

  return (
    <div className="card">
      <${m.capital}ListHeader />
      <${m.capital}Table />
      {isLoading && <${m.capital}ListLoading />}
      <${m.capital}ListPagination />
    </div>
  )
}

export { ${m.capital}List }`;
  }

  function generateModelsCode() {
    return `export interface User {
  id?: string
  username: string
  email: string
  first_name: string
  last_name: string
  department_id: string
  position_id: string
  leave_days: number
  status: 'Active' | 'Inactive' | 'On Leave'
  image_url: string
  createdAt?: string
  updatedAt?: string
}`;
  }

  function generateRequestsCode() {
    const m = currentModule;
    
    if (m.backendType === 'firebase') {
      return `import { collection, getDocs, getDoc, addDoc, updateDoc, deleteDoc, doc } from 'firebase/firestore'
import { ref, uploadBytes, getDownloadURL } from 'firebase/storage'
import { db, storage } from '${m.firebasePath}'
import { User } from './_models'

const COLLECTION = 'users'

// Get all
export const getUsers = async (): Promise<User[]> => {
  const querySnapshot = await getDocs(collection(db, COLLECTION))
  return querySnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() } as User))
}

// Get by ID
export const getUserById = async (id: string): Promise<User | null> => {
  const docSnap = await getDoc(doc(db, COLLECTION, id))
  return docSnap.exists() ? { id: docSnap.id, ...docSnap.data() } as User : null
}

// Create
export const createUser = async (data: User): Promise<User> => {
  const docRef = await addDoc(collection(db, COLLECTION), {
    ...data,
    createdAt: new Date().toISOString(),
    updatedAt: new Date().toISOString()
  })
  return { id: docRef.id, ...data }
}

// Update
export const updateUser = async (id: string, data: Partial<User>): Promise<void> => {
  await updateDoc(doc(db, COLLECTION, id), {
    ...data,
    updatedAt: new Date().toISOString()
  })
}

// Delete
export const deleteUser = async (id: string): Promise<void> => {
  await deleteDoc(doc(db, COLLECTION, id))
}

// Delete selected
export const deleteSelectedUsers = async (ids: string[]): Promise<void> => {
  const promises = ids.map(id => deleteUser(id))
  await Promise.all(promises)
}`;
    } else {
      return `import axios from 'axios'
import { User } from './_models'

const API_URL = '${m.apiUrl || 'http://localhost:8000/api'}/users'

export const getUsers = async (): Promise<User[]> => {
  const response = await axios.get(API_URL)
  return response.data
}

export const getUserById = async (id: string): Promise<User> => {
  const response = await axios.get(\`\${API_URL}/\${id}\`)
  return response.data
}

export const createUser = async (data: User): Promise<User> => {
  const response = await axios.post(API_URL, data)
  return response.data
}

export const updateUser = async (id: string, data: Partial<User>): Promise<User> => {
  const response = await axios.put(\`\${API_URL}/\${id}\`, data)
  return response.data
}

export const deleteUser = async (id: string): Promise<void> => {
  await axios.delete(\`\${API_URL}/\${id}\`)
}

  function generateQueryResponseProvider() {
    const m = currentModule;
    
    return `import { FC, useContext, useState, useEffect, useMemo, createContext } from 'react'
import { useQuery } from 'react-query'
import {
  initialQueryResponse,
  initialQueryState,
  QUERIES,
  stringifyRequestQuery,
  WithChildren,
} from '../../../../../../_metronic/helpers'
import { getUsers } from './_requests'
import { User } from './_models'
import { useQueryRequest } from './QueryRequestProvider'

type QueryResponseContextProps = {
  isLoading: boolean
  refetch: () => void
  response: typeof initialQueryResponse
  query: string
}

const QueryResponseContext = createContext<QueryResponseContextProps | undefined>(undefined)

const QueryResponseProvider: FC<WithChildren> = ({ children }) => {
  const { state } = useQueryRequest()
  const [query, setQuery] = useState(stringifyRequestQuery(state))
  const updatedQuery = useMemo(() => stringifyRequestQuery(state), [state])

  useEffect(() => {
    if (query !== updatedQuery) {
      setQuery(updatedQuery)
    }
  }, [updatedQuery])

  const { isFetching, refetch, data: response } = useQuery(
    \`\${QUERIES.USERS_LIST}-${m.name}s-\${query}\`,
    async () => {
      try {
        let items = await getUsers()
        
        if (state.search) {
          const searchTerm = state.search.toLowerCase()
          items = items.filter(item => 
            Object.values(item).some(val => 
              String(val).toLowerCase().includes(searchTerm)
            )
          )
        }

        const page = state.page || 1
        const itemsPerPage = state.items_per_page || 10
        const total = items.length
        const start = (page - 1) * itemsPerPage
        const paginatedItems = items.slice(start, start + itemsPerPage)

        return {
          data: paginatedItems,
          payload: {
            pagination: {
              current_page: page,
              last_page: Math.ceil(total / itemsPerPage),
              per_page: itemsPerPage,
              total: total,
              from: start + 1,
              to: start + paginatedItems.length,
              links: []
            }
          }
        }
      } catch (error) {
        return { data: [], payload: { pagination: initialQueryState } }
      }
    },
    { cacheTime: 0, keepPreviousData: true, refetchOnWindowFocus: false }
  )

  const value = { isLoading: isFetching, refetch, response: response || initialQueryResponse, query }

  return (
    <QueryResponseContext.Provider value={value}>
      {children}
    </QueryResponseContext.Provider>
  )
}

const useQueryResponse = () => {
  const context = useContext(QueryResponseContext)
  if (!context) throw new Error('useQueryResponse must be used within QueryResponseProvider')
  return context
}

const useQueryResponseData = (): User[] => {
  const { response } = useQueryResponse()
  return response?.data || []
}

const useQueryResponseLoading = (): boolean => {
  const { isLoading } = useQueryResponse()
  return isLoading
}

const useQueryResponsePagination = () => {
  const { response } = useQueryResponse()
  return response?.payload?.pagination || initialQueryState
}

export {
  QueryResponseProvider,
  useQueryResponse,
  useQueryResponseData,
  useQueryResponseLoading,
  useQueryResponsePagination
}`;
  }
